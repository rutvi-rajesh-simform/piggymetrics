version: '3.8'

x-cloud-env: &cloud-env
  SPRING_PROFILES_ACTIVE: cloud
  AWS_REGION: ${AWS_REGION:-us-east-1}
  SQS_QUEUE_URL: ${SQS_QUEUE_URL}
  DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME}
  SECRETS_MANAGER_SECRET_NAME: ${SECRETS_MANAGER_SECRET_NAME:-microservices/dev}

services:
  config:
    build: config
    ports:
      - 8888:8888
    profiles:
      - cloud
    environment:
      <<: *cloud-env

  gateway:
    build: gateway
    profiles:
      - cloud
    environment:
      <<: *cloud-env

  auth-service:
    build: auth-service
    ports:
      - 5000:5000
    profiles:
      - cloud
    environment:
      <<: *cloud-env
      DYNAMODB_TABLE_NAME: auth-users

  account-service:
    build: account-service
    ports:
      - 6000:6000
    profiles:
      - cloud
    environment:
      <<: *cloud-env
      DYNAMODB_TABLE_NAME: account-accounts

  statistics-service:
    build: statistics-service
    ports:
      - 7000:7000
    profiles:
      - cloud
    environment:
      <<: *cloud-env
      DYNAMODB_TABLE_NAME: statistics-stats

  notification-service:
    build: notification-service
    ports:
      - 8000:8000
    profiles:
      - cloud
    environment:
      <<: *cloud-env
      DYNAMODB_TABLE_NAME: notification-notifications

  monitoring:
    build: monitoring
    profiles:
      - cloud
    environment:
      <<: *cloud-env

  turbine-stream-service:
    build: turbine-stream-service
    profiles:
      - cloud
    environment:
      <<: *cloud-env