spring:
  application:
    name: registry
  cloud:
    config:
      uri: ${CONFIG_SERVICE_URI}
      fail-fast: true
      username: user
      password: ${CONFIG_SERVICE_PASSWORD}
  rabbitmq:
    addresses: ${AMQ_RABBITMQ_ENDPOINTS}
    username: ${AMQ_RABBITMQ_USERNAME}
    password: ${AMQ_RABBITMQ_PASSWORD}
    virtual-host: ${AMQ_RABBITMQ_VHOST:/}
    ssl:
      enabled: true
      algorithm: TLSv1.2

services:
  discovery:
    provider: cloud-map
  endpoints:
    config: ${CONFIG_SERVICE_URI}
    registry: ${REGISTRY_SERVICE_URI}
    gateway: ${GATEWAY_SERVICE_URI}