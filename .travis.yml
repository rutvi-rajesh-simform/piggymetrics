dist: trusty
sudo: required

services:
  - docker

language: java
jdk: oraclejdk8

env:
  global:
    - AWS_REGION=us-east-1
    - ECR_REPOSITORY_PREFIX=piggymetrics
    - ECS_CLUSTER=piggymetrics-cluster
    - ECS_SERVICE_PREFIX=piggymetrics
    - CFN_NETWORK_STACK=piggymetrics-network
    - CFN_ECS_STACK=piggymetrics-ecs
    - COMMIT=${TRAVIS_COMMIT::7}

before_install:
  - sudo apt-get update
  - sudo apt-get install -y python3-pip jq
  - pip3 install --user awscli
  - export PATH=$HOME/.local/bin:$PATH

script:
  - ./mvnw -q test || mvn -q test

after_success:
  - bash <(curl -s https://codecov.io/bash)
  - |
    set -euo pipefail

    : "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set in Travis CI settings}"
    : "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set in Travis CI settings}"
    : "${AWS_ACCOUNT_ID:?AWS_ACCOUNT_ID must be set in Travis CI settings}"

    TAG=$(if [ "$TRAVIS_BRANCH" = "master" ]; then echo "latest"; else echo "$TRAVIS_BRANCH"; fi)

    aws ecr get-login-password --region "$AWS_REGION" | \
      docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

    SERVICES=(
      config
      registry
      gateway
      auth-service
      account-service
      statistics-service
      notification-service
      monitoring
      turbine-stream-service
      mongodb
    )

    for svc in "${SERVICES[@]}"; do
      REPO_NAME="${ECR_REPOSITORY_PREFIX}-${svc}"
      IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME"

      aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$AWS_REGION" >/dev/null 2>&1 || \
        aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true --region "$AWS_REGION"

      docker build -t "$IMAGE_URI:$COMMIT" "./$svc"
      docker tag "$IMAGE_URI:$COMMIT" "$IMAGE_URI:$TAG"
      docker push "$IMAGE_URI:$COMMIT"
      docker push "$IMAGE_URI:$TAG"
    done

    if [ -f infra/network.yml ]; then
      aws cloudformation deploy \
        --template-file infra/network.yml \
        --stack-name "$CFN_NETWORK_STACK" \
        --capabilities CAPABILITY_NAMED_IAM \
        --region "$AWS_REGION"
    fi

    if [ -f infra/ecs-cluster.yml ]; then
      aws cloudformation deploy \
        --template-file infra/ecs-cluster.yml \
        --stack-name "$CFN_ECS_STACK" \
        --capabilities CAPABILITY_NAMED_IAM \
        --region "$AWS_REGION"
    fi

    for svc in "${SERVICES[@]}"; do
      TASKDEF_TEMPLATE="infra/ecs/taskdef-${svc}.json"
      if [ ! -f "$TASKDEF_TEMPLATE" ]; then
        echo "Skipping ECS deployment for $svc (missing $TASKDEF_TEMPLATE)"
        continue
      fi

      IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/${ECR_REPOSITORY_PREFIX}-${svc}:$COMMIT"
      RENDERED_TASKDEF="/tmp/taskdef-${svc}.json"

      sed "s|<IMAGE_URI>|$IMAGE_URI|g" "$TASKDEF_TEMPLATE" > "$RENDERED_TASKDEF"

      TASKDEF_ARN=$(aws ecs register-task-definition \
        --cli-input-json "file://$RENDERED_TASKDEF" \
        --region "$AWS_REGION" | jq -r '.taskDefinition.taskDefinitionArn')

      aws ecs update-service \
        --cluster "$ECS_CLUSTER" \
        --service "${ECS_SERVICE_PREFIX}-${svc}" \
        --task-definition "$TASKDEF_ARN" \
        --force-new-deployment \
        --region "$AWS_REGION"
    done