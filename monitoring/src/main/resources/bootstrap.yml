spring:
  application:
    name: monitoring
  cloud:
    config:
      uri: ${CONFIG_SERVER_URI:http://${CONFIG_SERVER_HOST:config}.${CLOUD_MAP_NAMESPACE:local}:${CONFIG_SERVER_PORT:8888}}
      fail-fast: ${CONFIG_FAIL_FAST:true}
      username: ${CONFIG_SERVICE_USERNAME:user}
      password: ${CONFIG_SERVICE_PASSWORD}