app:
  gateway:
    mode: api-gateway-fronted
    edge-proxy-enabled: false
    backend-services:
      auth-service:
        path: /uaa/**
        url: http://auth-service:5000
        strip-prefix: false
      account-service:
        path: /accounts/**
        url: http://account-service:5000
        strip-prefix: false
      statistics-service:
        path: /statistics/**
        url: http://statistics-service:5000
        strip-prefix: false
      notification-service:
        path: /notifications/**
        url: http://notification-service:5000
        strip-prefix: false

http:
  client:
    connect-timeout-millis: 20000
    read-timeout-millis: 20000

server:
  port: 4000