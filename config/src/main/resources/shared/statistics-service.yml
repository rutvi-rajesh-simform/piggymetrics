security:
  oauth2:
    client:
      clientId: statistics-service
      clientSecret: ${STATISTICS_SERVICE_PASSWORD}
      accessTokenUri: ${AUTH_SERVICE_TOKEN_URI:http://localhost:5000/uaa/oauth/token}
      grant-type: client_credentials
      scope: server

spring:
  config:
    import: "optional:aws-secretsmanager:/piggymetrics/statistics-service"
  cloud:
    discovery:
      enabled: false
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      stack:
        auto: false
      secretsmanager:
        enabled: true
        name: /piggymetrics/statistics-service
  data:
    mongodb:
      uri: ${DOCUMENTDB_URI:mongodb://user:${MONGODB_PASSWORD}@statistics-docdb.cluster.amazonaws.com:27017/piggymetrics?ssl=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false}
      database: ${MONGODB_DATABASE:piggymetrics}
      ssl:
        enabled: true

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

server:
  servlet:
    context-path: /statistics
  port: 7000

rates:
  url: ${RATES_API_URL:https://api.exchangeratesapi.io}