security:
  oauth2:
    client:
      clientId: account-service
      clientSecret: ${ACCOUNT_SERVICE_PASSWORD}
      accessTokenUri: http://auth-service:5000/uaa/oauth/token
      grant-type: client_credentials
      scope: server

spring:
  data:
    mongodb:
      uri: ${DOCUMENTDB_MONGO_URI}
      database: ${DOCUMENTDB_DATABASE:piggymetrics}
      ssl:
        enabled: ${DOCUMENTDB_TLS_ENABLED:true}
        invalid-hostname-allowed: ${DOCUMENTDB_TLS_ALLOW_INVALID_HOSTNAME:false}

server:
  servlet:
    context-path: /accounts
  port: 6000

feign:
  hystrix:
    enabled: true