security:
  oauth2:
    client:
      clientId: account-service
      clientSecret: ${ACCOUNT_SERVICE_PASSWORD}
      accessTokenUri: http://auth-service:5000/uaa/oauth/token
      grant-type: client_credentials
      scope: server

spring:
  data:
    mongodb:
      uri: ${APPCONFIG_DOCUMENTDB_URI}
      username: ${APPCONFIG_DOCUMENTDB_USERNAME}
      password: ${APPCONFIG_DOCUMENTDB_PASSWORD}
      database: ${APPCONFIG_DOCUMENTDB_DATABASE:piggymetrics}
      authentication-database: admin
      ssl:
        enabled: true

server:
  servlet:
    context-path: /accounts
  port: 6000

feign:
  hystrix:
    enabled: true