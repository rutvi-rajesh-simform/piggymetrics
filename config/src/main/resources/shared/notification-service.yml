security:
  oauth2:
    client:
      clientId: notification-service
      clientSecret: ${NOTIFICATION_SERVICE_PASSWORD}
      accessTokenUri: ${AUTH_SERVICE_OAUTH_TOKEN_URI:http://localhost:5000/uaa/oauth/token}
      grant-type: client_credentials
      scope: server

server:
  servlet:
    context-path: /notifications
  port: 8000

remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json

spring:
  config:
    import: "optional:aws-secretsmanager:/notification-service"
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      secretsmanager:
        enabled: true
        fail-fast: true
  data:
    mongodb:
      uri: ${DOCDB_URI:mongodb://user:${MONGODB_PASSWORD}@notification-docdb.cluster.local:27017/piggymetrics?tls=true&replicaSet=rs0&readPreference=secondaryPreferred&retryWrites=false}
      database: ${DOCDB_DATABASE:piggymetrics}
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true