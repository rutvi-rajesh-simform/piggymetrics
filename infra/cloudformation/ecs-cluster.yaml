AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ECS on AWS Fargate baseline for PiggyMetrics microservices. Provisions an ECS cluster,
  task execution/runtime IAM roles, Cloud Map namespace/service registration, one baseline
  Fargate service, and CPU-based autoscaling.

Parameters:
  ProjectName:
    Type: String
    Default: piggymetrics

  EnvironmentName:
    Type: String
    Default: prod

  ClusterName:
    Type: String
    Default: piggymetrics-ecs

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where ECS services run.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for Fargate tasks.

  ServiceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to ECS tasks.

  CloudMapNamespaceName:
    Type: String
    Default: piggymetrics.local
    Description: Private DNS namespace for service registration/discovery.

  BaselineServiceName:
    Type: String
    Default: config
    Description: Logical name for the baseline ECS service (e.g., config, gateway, auth-service).

  ContainerImage:
    Type: String
    Default: sqshq/piggymetrics-config:latest
    Description: Container image URI for the baseline service.

  ContainerPort:
    Type: Number
    Default: 8888
    Description: Container port exposed by the service.

  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues:
      - '256'
      - '512'
      - '1024'
      - '2048'
      - '4096'

  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues:
      - '512'
      - '1024'
      - '2048'
      - '3072'
      - '4096'
      - '5120'
      - '6144'
      - '7168'
      - '8192'
      - '16384'
      - '30720'

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1

  MinCapacity:
    Type: Number
    Default: 2
    MinValue: 1

  MaxCapacity:
    Type: Number
    Default: 6
    MinValue: 1

  CpuTargetUtilization:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90

  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref CloudMapNamespaceName
      Vpc: !Ref VpcId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref BaselineServiceName
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        RoutingPolicy: WEIGHTED
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvironmentName}-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvironmentName}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: baseline-runtime-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteAppLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}/${EnvironmentName}/${BaselineServiceName}:*
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}/${EnvironmentName}/${BaselineServiceName}
      RetentionInDays: !Ref LogRetentionInDays

  BaselineTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${EnvironmentName}-${BaselineServiceName}
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: docker
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  BaselineService:
    Type: AWS::ECS::Service
    DependsOn:
      - CloudMapService
    Properties:
      ServiceName: !Ref BaselineServiceName
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroupId
      TaskDefinition: !Ref BaselineTaskDefinition
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
          ContainerName: app
          ContainerPort: !Ref ContainerPort
      PropagateTags: SERVICE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  ServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn:
      - BaselineService
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Sub service/${ClusterName}/${BaselineServiceName}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ServiceCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-${EnvironmentName}-${BaselineServiceName}-cpu-target-tracking
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: !Ref CpuTargetUtilization
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  EcsClusterName:
    Description: ECS cluster name.
    Value: !Ref EcsCluster

  EcsClusterArn:
    Description: ECS cluster ARN.
    Value: !GetAtt EcsCluster.Arn

  TaskExecutionRoleArn:
    Description: IAM role used by ECS agent to pull images and publish logs.
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Description: IAM role assumed by application containers.
    Value: !GetAtt TaskRole.Arn

  CloudMapNamespaceId:
    Description: Cloud Map private DNS namespace ID.
    Value: !Ref CloudMapNamespace

  CloudMapNamespaceName:
    Description: Cloud Map private DNS namespace name.
    Value: !Ref CloudMapNamespaceName

  CloudMapServiceArn:
    Description: Cloud Map service ARN (usable by API Gateway private integrations).
    Value: !GetAtt CloudMapService.Arn

  BaselineEcsServiceName:
    Description: Baseline ECS service name.
    Value: !GetAtt BaselineService.Name

  BaselineTaskDefinitionArn:
    Description: Task definition ARN for the baseline service.
    Value: !Ref BaselineTaskDefinition
