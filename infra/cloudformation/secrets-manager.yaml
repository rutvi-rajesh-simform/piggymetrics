AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secrets for Mongo credentials, OAuth client secrets, SES sender config, and service passwords.

Parameters:
  AppName:
    Type: String
    Default: piggymetrics
    Description: Application/service prefix used in secret names.

  Environment:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    Description: Deployment environment (e.g. dev, stage, prod).

  DocumentDbEndpoint:
    Type: String
    Description: Amazon DocumentDB cluster endpoint (without protocol).

  DocumentDbPort:
    Type: Number
    Default: 27017
    Description: Amazon DocumentDB port.

  DocumentDbDatabase:
    Type: String
    Default: piggymetrics
    Description: Database name used by services.

  MongoUsername:
    Type: String
    Default: user
    Description: Mongo/DocumentDB username.

  MongoPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Mongo/DocumentDB password.

  ConfigServicePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password used by config service.

  NotificationServicePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password used by notification service OAuth client.

  StatisticsServicePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password used by statistics service OAuth client.

  AccountServicePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Password used by account service OAuth client.

  SesSenderEmail:
    Type: String
    Description: Verified SES sender email address.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  SesReplyToEmail:
    Type: String
    Default: ''
    Description: Optional SES reply-to email address.

  SesConfigurationSet:
    Type: String
    Default: ''
    Description: Optional SES configuration set name.

Resources:
  MongoCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AppName}/${Environment}/mongodb/credentials'
      Description: !Sub 'Mongo/DocumentDB credentials for ${AppName} (${Environment}).'
      SecretString: !Sub |
        {
          "username": "${MongoUsername}",
          "password": "${MongoPassword}",
          "host": "${DocumentDbEndpoint}",
          "port": ${DocumentDbPort},
          "database": "${DocumentDbDatabase}",
          "engine": "documentdb",
          "ssl": true,
          "authSource": "admin"
        }
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  OAuthClientSecrets:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AppName}/${Environment}/oauth/client-secrets'
      Description: !Sub 'OAuth client credentials for internal services in ${AppName} (${Environment}).'
      SecretString: !Sub |
        {
          "account-service": {
            "clientId": "account-service",
            "clientSecret": "${AccountServicePassword}"
          },
          "statistics-service": {
            "clientId": "statistics-service",
            "clientSecret": "${StatisticsServicePassword}"
          },
          "notification-service": {
            "clientId": "notification-service",
            "clientSecret": "${NotificationServicePassword}"
          }
        }
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  SesSenderConfigSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AppName}/${Environment}/ses/sender-config'
      Description: !Sub 'SES sender configuration for ${AppName} (${Environment}).'
      SecretString: !Sub |
        {
          "senderEmail": "${SesSenderEmail}",
          "replyToEmail": "${SesReplyToEmail}",
          "configurationSet": "${SesConfigurationSet}",
          "region": "${AWS::Region}"
        }
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  ServicePasswordsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AppName}/${Environment}/services/passwords'
      Description: !Sub 'Service passwords for ${AppName} (${Environment}).'
      SecretString: !Sub |
        {
          "CONFIG_SERVICE_PASSWORD": "${ConfigServicePassword}",
          "NOTIFICATION_SERVICE_PASSWORD": "${NotificationServicePassword}",
          "STATISTICS_SERVICE_PASSWORD": "${StatisticsServicePassword}",
          "ACCOUNT_SERVICE_PASSWORD": "${AccountServicePassword}",
          "MONGODB_PASSWORD": "${MongoPassword}"
        }
      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  MongoCredentialsSecretArn:
    Description: ARN of the Mongo/DocumentDB credentials secret.
    Value: !Ref MongoCredentialsSecret
    Export:
      Name: !Sub '${AWS::StackName}-MongoCredentialsSecretArn'

  OAuthClientSecretsArn:
    Description: ARN of the OAuth client secrets secret.
    Value: !Ref OAuthClientSecrets
    Export:
      Name: !Sub '${AWS::StackName}-OAuthClientSecretsArn'

  SesSenderConfigSecretArn:
    Description: ARN of the SES sender config secret.
    Value: !Ref SesSenderConfigSecret
    Export:
      Name: !Sub '${AWS::StackName}-SesSenderConfigSecretArn'

  ServicePasswordsSecretArn:
    Description: ARN of the service passwords secret.
    Value: !Ref ServicePasswordsSecret
    Export:
      Name: !Sub '${AWS::StackName}-ServicePasswordsSecretArn'